<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>MEXO Wallet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<section class="card">
<div class="brand"><div class="logo">M</div><div><b>MEXO</b><small>Airdrop Wallet</small></div></div>
<div class="hero"><div class="wallet-icon">◈</div><h1>MEXO WALLET</h1><p>Connect your TON Wallet to continue with your withdrawal.</p></div>
<div id="ton-connect"></div>
<div id="status" class="status">Connect your TON Wallet to continue.</div>
<div id="wallet-box" class="wallet-box hidden">
<div class="label">Connected Wallet</div>
<div id="wallet-address" class="address"></div>
<div id="proof-status" class="proof-status">Verifying wallet...</div>
</div>
<button id="use-wallet" class="primary hidden">USE THIS WALLET</button>
<p class="security">🔒 MEXO never asks for your seed phrase or private key.</p>
</section>
</main>
<script src="https://unpkg.com/@tonconnect/ui@3.0.0/dist/tonconnect-ui.min.js"></script>
<script src="app.js"></script>
</body>
</html>
